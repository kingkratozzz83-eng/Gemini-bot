name: Build Gemini WA Bot APK v4.5

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Engine & Build APK v4.5 (Video BG Loop + Screen Share Mode)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract Project ZIP & Persistent Keystore
        run: |
          for z in gemini-wa-bot-apk-github.zip *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o -q "$z"
              break
            fi
          done
          chmod +x gradlew || true

      - name: 3. Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Compile Embedded Go Engine (Android arm64 + Linux VPS amd64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          cd engine
          rm -f go.mod go.sum
          go mod init gemini-wabot-engine
          go get go.mau.fi/whatsmeow@latest golang.org/x/crypto/ssh@latest golang.org/x/crypto/x509roots/fallback@latest google.golang.org/protobuf/proto@latest modernc.org/sqlite@latest
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwabot_engine.so main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../app/src/main/jniLibs/x86_64/libwabot_engine.so main.go
          cd ..
          ls -lh app/src/main/jniLibs/arm64-v8a/libwabot_engine.so app/src/main/jniLibs/x86_64/libwabot_engine.so

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          dependency-graph: disabled

      - name: 7. Build Signed APK v4.5 (Update In-Place Without Uninstall)
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Gemini-WA-Bot-v4.5.apk
          ls -lh Gemini-WA-Bot-v4.5.apk

      - name: 8. Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-WA-Bot-APK-v4.5
          path: Gemini-WA-Bot-v4.5.apk
          if-no-files-found: error

      - name: 9. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v4.5.${{ github.run_number }}
          name: "DodosBot / Gemini WA Bot APK v4.5 Build #${{ github.run_number }}"
          body: |
            ### 🤖 DodosBot / Gemini WhatsApp Bot APK v4.5
            - **🎬 Video Background Loop Setelah Login (`bg_loop.mp4` via `TextureView`)** + tombol **🔊 Musik ON/OFF** & kartu UI semi-transparan.
            - **🔓 Mode Tidak Aman (Tampil Saat Berbagi Layar / Anti-Layar Hitam)**: Menonaktifkan blokir `FLAG_SECURE` dan proteksi layar sensitif Android 14/15 (`CONTENT_SENSITIVITY_NOT_SENSITIVE`) agar layar aplikasi & video background tetap terlihat jelas oleh penonton saat *Share Screen* di WhatsApp Video Call / Discord.
            - **🔒 Sertifikat Root CA Mozilla (`x509roots/fallback`)** untuk Mode Mandiri di HP.
          files: Gemini-WA-Bot-v4.5.apk
